name: 打包 iOS 鍵盤

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# 連續推好幾次時，只留最新的那次打包（避免舊的版本後完成、變成「最新版」）
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    # ARM runners have repeatedly timed out while waiting for capacity.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下載並轉換字典（小麥注音 MIT、OpenCC 繁簡 Apache 2.0）
        run: |
          git clone --depth 1 https://github.com/openvanilla/McBopomofo.git "$RUNNER_TEMP/McBopomofo"
          make -C "$RUNNER_TEMP/McBopomofo/Source/Data" data.txt
          for f in TSCharacters TSPhrases; do curl -sSfL -o "$RUNNER_TEMP/$f.txt" "https://raw.githubusercontent.com/BYVoid/OpenCC/master/data/dictionary/$f.txt"; done
          python3 tools/build_dict.py "$RUNNER_TEMP/McBopomofo/Source/Data/data.txt" Keyboard/Resources/zhuyin.sqlite "$RUNNER_TEMP/TSCharacters.txt" "$RUNNER_TEMP/TSPhrases.txt"
          cp "$RUNNER_TEMP/McBopomofo/LICENSE.txt" Keyboard/Resources/McBopomofo-LICENSE.txt

      - name: 下載可愛字體並縮小（粉圓、芫荽、霞鶩文楷，都是 SIL OFL 1.1）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q fonttools
          curl -sSfL -o "$RUNNER_TEMP/huninn.ttf" https://github.com/justfont/open-huninn-font/releases/download/v2.1/jf-openhuninn-2.1.ttf
          curl -sSfL -o "$RUNNER_TEMP/iansui.zip" https://github.com/ButTaiwan/iansui/releases/download/v1.020/iansui.zip
          unzip -q -o "$RUNNER_TEMP/iansui.zip" -d "$RUNNER_TEMP/iansui"
          IANSUI=$(find "$RUNNER_TEMP/iansui" \( -iname "*.ttf" -o -iname "*.otf" \) | head -1)
          curl -sSfL -o "$RUNNER_TEMP/wenkai.ttf" https://github.com/lxgw/LxgwWenkaiTC/releases/download/v1.530/LXGWWenKaiTC-Regular.ttf
          "$RUNNER_TEMP/venv/bin/python" tools/build_fonts.py Keyboard/Resources/zhuyin.sqlite Keyboard/Resources/Fonts huninn="$RUNNER_TEMP/huninn.ttf" iansui="$IANSUI" wenkai="$RUNNER_TEMP/wenkai.ttf"

      - name: 下載英文常用字表（滑行輸入用；FrequencyWords，CC BY-SA 4.0）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/en_50k.txt" https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt
          python3 tools/build_words.py "$RUNNER_TEMP/en_50k.txt" Keyboard/Resources/glide_words.txt

      - name: 核心邏輯測試（注音組字、選字、剪貼簿）
        run: swift test --package-path Core

      - name: 產生 Xcode 專案
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: 編譯
        run: |
          xcodebuild -project StarKeyboard.xcodeproj -scheme StarKeyboard -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -60; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | grep -v "/build/" | sort -u | head -40 || true

      - name: 包成 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StarKeyboard.app Payload/
          ls -la Payload/StarKeyboard.app/PlugIns
          du -sh Payload/StarKeyboard.app
          zip -qry StarKeyboard.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StarKeyboard-ipa
          path: StarKeyboard.ipa

      - name: 整理這次更新了什麼
        run: |
          PREV=$(git describe --tags --abbrev=0 --match "build-*" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "這次更新："
            git log --no-merges --pretty="- %s" $RANGE -- . ":(exclude)android" | head -20
            echo
            echo "下載 StarKeyboard.ipa，用 Sideloadly 直接裝（不要先刪掉舊的，設定和資料會保留）。"
          } > release_notes.md
          cat release_notes.md

      - name: 發佈到 Releases（方便下載）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 糯糯鍵盤 第 ${{ github.run_number }} 版
          body_path: release_notes.md
          files: StarKeyboard.ipa
          make_latest: "true"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
